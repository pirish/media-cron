[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-cron"
version = "0.1.0"
description = "Pluggable media file organizer, sanitizer, and cleaner CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Media-Cron Authors" }
]
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "tinytag>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
media-cron = "media_cron.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["media_cron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
